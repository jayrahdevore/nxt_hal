# Host-side uploader. Its own workspace: the root workspace builds only for
# armv4t-none-eabi.
[workspace]

[package]
name = "nxtboot"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Host uploader for the nxt-boot USB bootloader"

[dependencies]
nxt-boot-proto = { path = "../../crates/nxt-boot-proto" }
rusb = "0.9"
