[package]
name = "nxt-rt"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Boot/startup runtime for the NXT's ARM7TDMI (armv4t-none-eabi): vector table, reset handler, panic handler. There is no cortex-m-rt equivalent for this architecture outside the GBA-specific Rust crates, so this is hand-written."
